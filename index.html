<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스탬프 투어</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', sans-serif; }
    body { background: #f4f5f7; color: #333; display: flex; justify-content: center; min-height: 100vh; padding: 20px 16px; }
    .container { width: 100%; max-width: 420px; background: #fff; border-radius: 24px; padding: 28px 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
    
    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 22px; font-weight: 800; color: #111; margin-bottom: 6px; cursor: pointer; user-select: none; }
    header p { font-size: 13px; color: #64748b; line-height: 1.4; }

    /* 메인 보드 그리드 */
    .stamp-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-bottom: 24px; }
    .stamp-slot {
      width: 95px; height: 110px; background: #fafafa; border: 2px dashed #d1d5db; border-radius: 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
      position: relative; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stamp-slot:active { transform: scale(0.95); }
    .stamp-slot .badge-icon { width: 48px; height: 48px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #9ca3af; margin-bottom: 8px; }
    .stamp-slot .title { font-size: 12px; font-weight: 600; color: #4b5563; text-align: center; }

    /* 메인 보드에서 완료 시 체크 표시 스타일 */
    .stamp-slot.stamped { border: 2px solid #ef4444; background: #fef2f2; }
    .stamp-slot.stamped .badge-icon { background: #ef4444; color: #fff; font-size: 22px; font-weight: bold; }
    .stamp-slot.stamped .title { color: #dc2626; }

    /* 상태 박스 */
    .status-box { background: #f8fafc; border-radius: 14px; padding: 14px; text-align: center; font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 12px; }
    .status-box.all-complete { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .status-box.redeemed { background: #f1f5f9; color: #94a3b8; border: 1px solid #cbd5e1; }

    /* 사은품 수령 버튼 & 배너 */
    .reward-area { display: none; margin-top: 4px; }
    .btn-reward {
      width: 100%; padding: 16px; background: #e11d48; color: #fff; font-size: 16px; font-weight: 700;
      border: none; border-radius: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(225,29,72,0.3);
      animation: pulse 1.8s infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .reward-completed-badge {
      display: none; background: #f8fafc; border: 2px dashed #94a3b8; border-radius: 14px;
      padding: 16px; text-align: center; color: #64748b; font-weight: 700; font-size: 15px; margin-top: 4px;
    }

    /* 팝업 모달 공통 레이아웃 */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      justify-content: center; align-items: center; padding: 20px; z-index: 100; backdrop-filter: blur(2px);
    }
    .modal-overlay.active { display: flex; }
    .modal-box { background: #fff; width: 100%; max-width: 330px; border-radius: 20px; padding: 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .modal-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
    .modal-box p.desc { font-size: 13px; color: #64748b; line-height: 1.5; margin-bottom: 18px; text-align: left; background: #f1f5f9; padding: 12px; border-radius: 10px; white-space: pre-line; }
    .modal-box input {
      width: 100%; padding: 12px; border: 1.5px solid #cbd5e1; border-radius: 10px;
      font-size: 15px; text-align: center; margin-bottom: 14px; outline: none;
    }
    .modal-box input:focus { border-color: #2563eb; }
    .btn-group { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn-submit { background: #2563eb; color: #fff; }
    .btn-close { background: #e2e8f0; color: #475569; }
    .btn-staff-confirm { background: #e11d48; color: #fff; }

    /* 모달 내부 스탬프 이미지 박스 */
    .modal-stamp-preview {
      width: 100px; height: 100px; margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-stamp-preview img { width: 100%; height: 100%; object-fit: contain; }

    /* 도장 획득 축하 팝업 전용 스타일 */
    .stamp-acquired-box { background: #fff; width: 100%; max-width: 320px; border-radius: 24px; padding: 28px 20px; text-align: center; }
    .stamp-pop-animation {
      width: 110px; height: 110px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      animation: stampImpact 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .stamp-pop-animation img { width: 100%; height: 100%; object-fit: contain; }
    @keyframes stampImpact {
      0% { transform: scale(2.2) rotate(-15deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .stamp-acquired-box h2 { font-size: 20px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .stamp-acquired-box p { font-size: 13px; color: #64748b; margin-bottom: 20px; line-height: 1.4; }
    .btn-confirm-acquired { width: 100%; padding: 14px; background: #111; color: #fff; font-size: 14px; font-weight: 700; border: none; border-radius: 12px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 id="mainTitle">스탬프 투어</h1>
    <p>각 부스를 체험하고 암호를 입력해 도장을 모으세요.<br>5개를 모두 모으면 사은품을 드립니다!</p>
  </header>

  <div class="stamp-grid" id="stampGrid"></div>
  <div class="status-box" id="statusBox">진행도: 0 / 5</div>

  <!-- 사은품 수령 버튼 -->
  <div class="reward-area" id="rewardArea">
    <button class="btn-reward" onclick="openStaffModal()">🎁 사은품 수령하기 (스태프 확인)</button>
  </div>

  <!-- 수령 완료 배너 -->
  <div class="reward-completed-badge" id="rewardCompletedBadge">
    ✓ 사은품 수령이 완료되었습니다.<br>
    <span style="font-size: 12px; font-weight: normal; color: #94a3b8;" id="redeemedTimeText"></span>
  </div>
</div>

<!-- 1. 부스 정보 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <h3 id="modalTitle">부스 이름</h3>
    <p class="desc" id="modalDesc">부스 설명 내용</p>

    <!-- 미완료 시: 암호 입력 영역 -->
    <div id="modalInputArea">
      <input type="text" id="passInput" placeholder="부스 인증 암호 입력" autocomplete="off">
      <div class="btn-group">
        <button class="btn btn-close" onclick="closeModal()">닫기</button>
        <button class="btn btn-submit" onclick="submitPass()">도장 찍기</button>
      </div>
    </div>

    <!-- 이미 완료 시: PNG 이미지 표시 영역 -->
    <div id="modalAlreadyDone" style="display:none;">
      <div class="modal-stamp-preview" id="alreadyDoneStampImg"></div>
      <p style="color:#ef4444; font-weight:700; margin-bottom:16px;">이미 도장을 획득한 부스입니다!</p>
      <button class="btn btn-close" style="width:100%" onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>

<!-- 2. 도장 획득 축하 모달 (PNG 이미지 팝업) -->
<div class="modal-overlay" id="stampSuccessModal">
  <div class="stamp-acquired-box">
    <div class="stamp-pop-animation" id="stampSuccessVisual"></div>
    <h2 id="stampSuccessTitle">스탬프 획득!</h2>
    <p id="stampSuccessSubtitle">부스 미션을 성공적으로 완료했습니다.</p>
    <button class="btn-confirm-acquired" onclick="closeStampSuccessModal()">확인</button>
  </div>
</div>

<!-- 3. 스태프 확인 모달 -->
<div class="modal-overlay" id="staffModalOverlay">
  <div class="modal-box">
    <h3 style="color:#e11d48;">운영 본부 확인</h3>
    <p class="desc" style="background:#fff1f2; color:#be123c;">
      ※ 주의: 본 화면은 <strong>운영 스태프 전용</strong>입니다.<br>
      확인 후에는 재수령 및 추가 참여가 불가능합니다.
    </p>
    <input type="password" id="staffPassInput" placeholder="스태프 인증 핀번호 입력" autocomplete="off">
    <div class="btn-group">
      <button class="btn btn-close" onclick="closeStaffModal()">취소</button>
      <button class="btn btn-staff-confirm" onclick="confirmRedeem()">지급 완료 처리</button>
    </div>
  </div>
</div>

<script>
  // ▼ Apps Script 웹 앱 URL 입력
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx-hc5yc47KEGOjyZREZKCt0p7RezgLc8-AAKkQOYsnZ-w-TmJTyT1R-6PAg7AsxUOTyg/exec";

  // ▼ 운영 스태프 확인용 비밀번호
  const STAFF_PIN = "0000";

  // 부스 정보 및 도장 이미지 (저장소에 올린 파일명에 맞게 조정하세요)
  const booths = [
    { id: 1, name: "부스 1", pass: "영화", desc: "위치: KOFIC x 한국저작권위원회 부스\n미션: 부스 방문 후 미니게임 참여", stampImg: "stamp1.png" },
    { id: 2, name: "부스 2", pass: "진흥", desc: "위치: 시․청각장애인 영화관람지원 서비스 '가치봄' 부스\n미션: 공식 인스타그램 팔로우 인증", stampImg: "stamp2.png" },
    { id: 3, name: "부스 3", pass: "위원회", desc: "위치: 영화인신문고 부스\n미션: 영화인 신문고 OX퀴즈 참여", stampImg: "stamp3.png" },
    { id: 4, name: "부스 4", pass: "가치", desc: "위치: 한국영화성평등센터 든든 부스\n미션: 공식 인스타그램 좋아요 인증", stampImg: "stamp4.png" },
    { id: 5, name: "부스 5", pass: "라운지", desc: "위치: 가치 라운지 안내 부스\n미션: 만족도 설문조사 참여", stampImg: "stamp5.png" }
  ];

  let currentBoothIndex = null;

  let userId = localStorage.getItem('stamp_user_id');
  if (!userId) {
    userId = 'user_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('stamp_user_id', userId);
  }

  function getCompleted() {
    return JSON.parse(localStorage.getItem('booth_stamps') || '[]');
  }

  function isRedeemed() {
    return localStorage.getItem('booth_reward_redeemed') === 'true';
  }

  // 메인 보드 렌더링: 완료된 곳은 깔끔한 체크(✓) 표시
  function renderGrid() {
    const completed = getCompleted();
    const redeemed = isRedeemed();
    const grid = document.getElementById('stampGrid');
    grid.innerHTML = '';

    booths.forEach((b, idx) => {
      const isDone = completed.includes(b.id);
      const slot = document.createElement('div');
      slot.className = `stamp-slot ${isDone ? 'stamped' : ''}`;
      
      if (!redeemed) {
        slot.onclick = () => openBoothModal(idx);
      } else {
        slot.style.cursor = 'default';
      }

      slot.innerHTML = `
        <div class="badge-icon">${isDone ? '✓' : idx + 1}</div>
        <div class="title">${b.name}</div>
      `;
      grid.appendChild(slot);
    });

    const statusBox = document.getElementById('statusBox');
    const rewardArea = document.getElementById('rewardArea');
    const rewardCompletedBadge = document.getElementById('rewardCompletedBadge');

    if (redeemed) {
      statusBox.className = 'status-box redeemed';
      statusBox.innerText = '이벤트 참여 및 수령 완료';
      rewardArea.style.display = 'none';
      rewardCompletedBadge.style.display = 'block';
      const time = localStorage.getItem('booth_reward_time') || '';
      if (time) document.getElementById('redeemedTimeText').innerText = `수령 시각: ${time}`;
    } else if (completed.length === booths.length) {
      statusBox.className = 'status-box all-complete';
      statusBox.innerText = '★ 모든 도장 획득 완료! ★';
      rewardArea.style.display = 'block';
      rewardCompletedBadge.style.display = 'none';
    } else {
      statusBox.className = 'status-box';
      statusBox.innerText = `진행도: ${completed.length} / ${booths.length}`;
      rewardArea.style.display = 'none';
      rewardCompletedBadge.style.display = 'none';
    }
  }

  // 부스 모달 열기: 이미 완료된 부스 클릭 시 업로드한 스탬프 PNG 노출
  function openBoothModal(index) {
    if (isRedeemed()) return;
    currentBoothIndex = index;
    const booth = booths[index];
    const completed = getCompleted();
    const isDone = completed.includes(booth.id);

    document.getElementById('modalTitle').innerText = booth.name;
    document.getElementById('modalDesc').innerText = booth.desc;
    document.getElementById('passInput').value = '';

    if (isDone) {
      document.getElementById('modalInputArea').style.display = 'none';
      const previewArea = document.getElementById('alreadyDoneStampImg');
      previewArea.innerHTML = `<img src="${booth.stampImg}" alt="획득한 도장" onerror="this.onerror=null; this.parentNode.innerHTML='<div style=\'font-size:36px;color:#ef4444;\'>✓</div>';">`;
      document.getElementById('modalAlreadyDone').style.display = 'block';
    } else {
      document.getElementById('modalInputArea').style.display = 'block';
      document.getElementById('modalAlreadyDone').style.display = 'none';
    }

    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function submitPass() {
    const input = document.getElementById('passInput').value.trim();
    const targetBooth = booths[currentBoothIndex];

    if (input === targetBooth.pass) {
      const completed = getCompleted();
      if (!completed.includes(targetBooth.id)) {
        completed.push(targetBooth.id);
        localStorage.setItem('booth_stamps', JSON.stringify(completed));
        sendSheetLog(targetBooth.name);
      }
      closeModal();
      renderGrid();
      openStampSuccessModal(targetBooth);
    } else {
      alert("암호가 올바르지 않습니다. 부스 스태프에게 확인해 주세요.");
    }
  }

  // 도장 획득 축하 팝업: PNG 이미지 출력
  function openStampSuccessModal(booth) {
    const visual = document.getElementById('stampSuccessVisual');
    visual.innerHTML = `<img src="${booth.stampImg}" alt="도장" onerror="this.onerror=null; this.parentNode.innerHTML='<span style=\'font-size:46px;color:#ef4444;\'>✓</span>';">`;

    document.getElementById('stampSuccessTitle').innerText = `[${booth.name}] 스탬프 획득!`;
    document.getElementById('stampSuccessSubtitle').innerText = "미션을 완료하여 도장이 정상 등록되었습니다.";
    document.getElementById('stampSuccessModal').classList.add('active');
  }

  function closeStampSuccessModal() {
    document.getElementById('stampSuccessModal').classList.remove('active');
  }

  // 스태프 확인 모달
  function openStaffModal() {
    document.getElementById('staffPassInput').value = '';
    document.getElementById('staffModalOverlay').classList.add('active');
  }

  function closeStaffModal() {
    document.getElementById('staffModalOverlay').classList.remove('active');
  }

  function confirmRedeem() {
    const pin = document.getElementById('staffPassInput').value.trim();
    if (pin === STAFF_PIN) {
      const nowStr = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
      localStorage.setItem('booth_reward_redeemed', 'true');
      localStorage.setItem('booth_reward_time', nowStr);

      sendSheetLog("★ 사은품 수령 완료");

      closeStaffModal();
      renderGrid();
      alert("사은품 지급 확인 처리가 완료되었습니다.");
    } else {
      alert("스태프 비밀번호가 일치하지 않습니다.");
    }
  }

  function sendSheetLog(boothName) {
    if (GOOGLE_SCRIPT_URL && !GOOGLE_SCRIPT_URL.includes("https://script.google.com/macros/s/AKfycbx-hc5yc47KEGOjyZREZKCt0p7RezgLc8-AAKkQOYsnZ-w-TmJTyT1R-6PAg7AsxUOTyg/exec")) {
      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          userId: userId,
          boothName: boothName
        })
      }).catch(err => console.log("전송 로그:", err));
    }
  }

  // 타이틀 5번 클릭 시 초기화 (테스트용)
  let titleClicks = 0;
  let resetTimer = null;
  document.getElementById('mainTitle').addEventListener('click', () => {
    titleClicks++;
    clearTimeout(resetTimer);
    if (titleClicks >= 5) {
      if (confirm('[테스트 모드] 모든 도장 및 수령 기록을 초기화하시겠습니까?')) {
        localStorage.removeItem('booth_stamps');
        localStorage.removeItem('booth_reward_redeemed');
        localStorage.removeItem('booth_reward_time');
        localStorage.removeItem('stamp_user_id');
        location.reload();
      }
      titleClicks = 0;
    }
    resetTimer = setTimeout(() => { titleClicks = 0; }, 1500);
  });

  renderGrid();
</script>
</body>
</html>
